name: Phase 24 C detached own acknowledgements

on:
  push:
    branches:
      - development/phase-24-c-own-acknowledgements-20261109
  pull_request:
    paths:
      - 'server/src/api/routes/reportOwnAcknowledgementCandidateRoutes.ts'
      - 'server/tests/db/report24COwnCandidate.test.ts'
      - '.github/workflows/phase24-c-own-acknowledgements.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Owner reader and export security regression
        run: node --import tsx --test server/tests/reportC1dOwnAcknowledgements.test.ts server/tests/reportC1dOwnerExport.test.ts server/tests/reportC9bOwnerViewLogBound.test.ts server/tests/reportC14ReleaseGate.test.ts
      - name: PostgreSQL and detached real-session HTTP (includes 24-C)
        run: npm run test:db
      - run: npm run test:api
      - run: npm run build
