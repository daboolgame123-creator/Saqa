name: Phase 23 pilot real login integration

on:
  push:
    branches:
      - development/phase23-pilot-login-20261107
  pull_request:
    paths:
      - 'src/api/apiClient.ts'
      - 'src/api/sessionToken.ts'
      - 'src/api/pilotAuth.ts'
      - 'src/App.tsx'
      - 'src/components/layout/Header.tsx'
      - 'src/components/views/PilotAuthScreens.tsx'
      - 'vite.config.ts'
      - 'server/tests/pilotFrontendAuth.test.ts'
      - 'server/tests/api/pilotLoginBridge.test.ts'
      - '.github/workflows/pilot-real-login.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Focused frontend auth unit
        run: node --import tsx --test server/tests/pilotFrontendAuth.test.ts
      - name: Full server tests
        run: npm run test:server
      - name: Full migrated PostgreSQL tests
        run: npm run test:db
      - name: Real HTTP auth pilot and remaining API tests
        run: npm run test:api
      - name: Vite build
        run: npm run build
