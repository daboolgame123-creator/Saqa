name: Phase 23 UI-10 reports notice

on:
  push:
    branches:
      - development/phase-23-ui10-report-safety-notice-20261107
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/components/views/ReportsView.tsx'
      - 'src/components/views/index.ts'
      - 'server/tests/reportUi10Notice.test.ts'
      - '.github/workflows/phase23-ui10-notice.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: React and server tests
        run: npm run test:server
      - name: Database tests
        run: npm run test:db
      - name: API tests
        run: npm run test:api
      - name: Build
        run: npm run build
