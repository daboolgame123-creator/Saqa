name: Phase 23 C3 situation filter validation

on:
  push:
    branches:
      - development/phase-23-c3-situation-filter-20261107
  pull_request:
    paths:
      - 'server/src/api/validation/reportValidators.ts'
      - 'server/tests/reportP0.test.ts'
      - '.github/workflows/phase23-c3-filter.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Server tests
        run: npm run test:server
      - name: Migrated PostgreSQL tests
        run: npm run test:db
      - name: HTTP API tests
        run: npm run test:api
      - name: Build
        run: npm run build
