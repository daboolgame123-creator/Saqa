name: Pilot API fail-closed startup (isolated)

on:
  push:
    branches:
      - development/phase23-pilot-api-failclosed-20261107
  pull_request:
    paths:
      - 'src/api/index.ts'
      - 'src/App.tsx'
      - 'server/tests/pilotStartupSource.test.ts'
      - 'PILOT_STARTUP_DATA_SOURCE_SAFETY.md'
      - '.github/workflows/pilot-api-startup-failclosed.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Startup fail-closed focused unit test
        run: node --import tsx --test server/tests/pilotStartupSource.test.ts
      - name: All server tests
        run: npm run test:server
      - name: Migrated PostgreSQL tests
        run: npm run test:db
      - name: API tests
        run: npm run test:api
      - name: Build
        run: npm run build
